<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Dockside | Dockside Paddle Co.</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary: #0077b6;
      --secondary: #00b4d8;
      --user-bubble: #0077b6;
      --bot-bubble: #e9ecef;
      --text-dark: #212529;
      --text-light: #ffffff;
      --subtext: #6c757d;
      --error-color: #721c24;
      --error-bg: #f8d7da;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
    }

    header {
      background-color: var(--primary);
      color: var(--text-light);
      padding: 16px;
      text-align: center;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; }
    header p { font-size: 0.8rem; opacity: 0.9; margin-top: 2px; }

    #chat-window {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble-container {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .bubble-container.user { align-self: flex-end; align-items: flex-end; }
    .bubble-container.bot { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .user .bubble {
      background-color: var(--user-bubble);
      color: var(--text-light);
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background-color: var(--bot-bubble);
      color: var(--text-dark);
      border-bottom-left-radius: 4px;
    }

    .timestamp {
      font-size: 0.7rem;
      color: var(--subtext);
      margin-top: 4px;
      padding: 0 4px;
    }

    .thinking { font-style: italic; color: var(--subtext); }

    .error-bubble {
      background-color: var(--error-bg) !important;
      color: var(--error-color) !important;
      border: 1px solid #f5c6cb;
    }

    footer {
      padding: 12px;
      background-color: var(--card-bg);
      border-top: 1px solid #ddd;
    }

    #chat-form { display: flex; gap: 8px; }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 24px;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus { border-color: var(--primary); }

    button {
      background-color: var(--primary);
      color: var(--text-light);
      border: none;
      padding: 12px 20px;
      border-radius: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <h1>Ask Dockside</h1>
    <p>Grand Canal Dock • Dublin</p>
  </header>

  <div id="chat-window">
    <div class="bubble-container bot">
      <div class="bubble">Hello! I'm Ask Dockside. How can I help you with our watersports sessions today?</div>
    </div>
  </div>

  <footer>
    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Ask about sessions, prices, or weather..." required autocomplete="off">
      <button type="submit" id="send-btn">Send</button>
    </form>
  </footer>

  <script>
    const chatWindow = document.getElementById('chat-window');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    const SESSIONS_CSV_URL = 'https://bdaib-hub.pages.dev/data/dockside/sessions.csv';
    const WEATHER_API_URL = 'https://api.open-meteo.com/v1/forecast?latitude=53.3444&longitude=-6.2372&current=wind_speed_10m&timezone=Europe/Dublin';
    const RELAY_CHAT_URL = 'https://luas-class.kluxy.app/chat';

    const SYSTEM = `You are Ask Dockside, the customer assistant for Dockside Paddle Co. at Grand Canal Dock in Dublin.
Answer strictly based on the live data provided in the CSV and Weather JSON.

STRICT CSV PARSING INSTRUCTIONS:
1. ROW PARSING: Treat the CSV as a comma-separated table. To answer questions about a session, locate its row by code (e.g., DS10, DS11) or exact name.
2. COLUMN MATCHING: Match the exact headers:
   - 'price_eur' for prices.
   - 'places_left' for remaining spots.
   Do not shift columns or read values from adjacent rows above/below.
3. DATA INTEGRITY: Double-check the exact integer in the 'places_left' column for that specific line before forming your sentence.
4. SAFETY/WEATHER: Compare live wind speed (JSON) with session max_wind_kmh (CSV). Always state BOTH numbers (e.g., "current wind is X km/h, session limit is Y km/h") and conclude if safe.
5. UNKNOWN SERVICES: If a service (like bike rentals) is not in the CSV, state clearly that it is not offered.
6. Be direct, accurate, and concise.`;

    function getFormattedTime() {
      return new Date().toTimeString().split(' ')[0];
    }

    function appendMessage(role, text, isError = false) {
      const container = document.createElement('div');
      container.className = `bubble-container ${role}`;

      const bubble = document.createElement('div');
      bubble.className = `bubble ${isError ? 'error-bubble' : ''}`;
      bubble.textContent = text;
      container.appendChild(bubble);

      if (role === 'bot' && !isError) {
        const timeStamp = document.createElement('div');
        timeStamp.className = 'timestamp';
        timeStamp.textContent = `Data fetched live at ${getFormattedTime()}`;
        container.appendChild(timeStamp);
      }

      chatWindow.appendChild(container);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return container;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = userInput.value.trim();
      if (!question) return;

      appendMessage('user', question);
      userInput.value = '';
      sendBtn.disabled = true;

      const thinkingBubble = appendMessage('bot', 'Thinking...');
      thinkingBubble.querySelector('.bubble').classList.add('thinking');

      try {
        // 1. Fetch Planilha
        const csvRes = await fetch(SESSIONS_CSV_URL);
        if (!csvRes.ok) throw new Error(`CSV fetch failed: ${csvRes.status}`);
        const csvData = await csvRes.text();

        // 2. Fetch Clima
        let weatherText = "Weather data unavailable";
        try {
          const wRes = await fetch(WEATHER_API_URL);
          if (wRes.ok) {
            const wJson = await wRes.json();
            weatherText = JSON.stringify(wJson.current || {});
          }
        } catch (wErr) {
          console.warn("Weather error:", wErr);
        }

        // 3. Enviar ao Relay
        const payload = {
          system: SYSTEM,
          messages: [
            {
              role: "user",
              content: `Today's sessions (CSV):\n${csvData}\n\nLive weather (JSON):\n${weatherText}\n\nCustomer question: ${question}`
            }
          ]
        };

        const chatRes = await fetch(RELAY_CHAT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!chatRes.ok) throw new Error(`Relay response error: ${chatRes.status}`);

        const result = await chatRes.json();
        chatWindow.removeChild(thinkingBubble);
        
        if (result.reply) {
          appendMessage('bot', result.reply);
        } else {
          appendMessage('bot', 'Received empty reply from server.', true);
        }

      } catch (err) {
        if (thinkingBubble.parentNode) {
          chatWindow.removeChild(thinkingBubble);
        }
        appendMessage('bot', `Error: ${err.message}`, true);
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
