<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Dockside | Dockside Paddle Co.</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary: #0077b6;
      --secondary: #00b4d8;
      --user-bubble: #0077b6;
      --bot-bubble: #e9ecef;
      --text-dark: #212529;
      --text-light: #ffffff;
      --subtext: #6c757d;
      --error-color: #d9534f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 600px;
      margin: 0 auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.05);
    }

    header {
      background-color: var(--primary);
      color: var(--text-light);
      padding: 16px;
      text-align: center;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    header p {
      font-size: 0.8rem;
      opacity: 0.9;
      margin-top: 2px;
    }

    #chat-window {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble-container {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .bubble-container.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .bubble-container.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .user .bubble {
      background-color: var(--user-bubble);
      color: var(--text-light);
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background-color: var(--bot-bubble);
      color: var(--text-dark);
      border-bottom-left-radius: 4px;
    }

    .timestamp {
      font-size: 0.7rem;
      color: var(--subtext);
      margin-top: 4px;
      padding: 0 4px;
    }

    .thinking {
      font-style: italic;
      color: var(--subtext);
    }

    .error-bubble {
      background-color: #f8d7da !important;
      color: var(--error-color) !important;
      border: 1px solid #f5c6cb;
    }

    footer {
      padding: 12px;
      background-color: var(--card-bg);
      border-top: 1px solid #ddd;
    }

    #chat-form {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 24px;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: var(--text-light);
      border: none;
      padding: 12px 20px;
      border-radius: 24px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--secondary);
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ask Dockside</h1>
    <p>Grand Canal Dock • Dublin</p>
  </header>

  <div id="chat-window">
    <div class="bubble-container bot">
      <div class="bubble">Hello! I'm Ask Dockside. How can I help you with our watersports sessions today?</div>
    </div>
  </div>

  <footer>
    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Ask about sessions, prices, or weather..." required autocomplete="off">
      <button type="submit" id="send-btn">Send</button>
    </form>
  </footer>
